# Application Configuration
spring.application.name=item-service

# Project version for log file naming
spring.application.version=@project.version@

# Server Configuration
server.port=8080

# Spring Cloud Config Server Configuration
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://localhost:8888/config
spring.cloud.config.profile=dev
spring.cloud.config.label=main
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.max-attempts=3
spring.cloud.config.enabled=true
spring.cloud.config.import-check.enabled=false

# Authentication for Spring Cloud Config Server
spring.cloud.config.username=configuser
spring.cloud.config.password=configpass

# Logging Configuration - Optimized for startup detection
logging.level.com.example.itemservice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.cloud=INFO
logging.level.org.hibernate.validator=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ConfigServerConnectionMonitor - Keep essential monitoring
logging.level.com.example.itemservice.config.ConfigServerConnectionMonitor=INFO

# Log file paths (referenced in logback-spring.xml)
logging.file.path=logs

# JSON Content Logging Configuration
# Set to true to include request/response JSON content in logs
# Set to false to log only headers and metadata (recommended for production)
logging.json-content.enabled=true
logging.http.enabled=true

# Validation Configuration
spring.web.resources.add-mappings=false

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Configuration Polling Settings
# Enable automatic polling for configuration changes (default: true)
config.polling.enabled=true
# Polling interval in milliseconds (default: 30000 = 30 seconds)
config.polling.interval=30000

# Swagger
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true
