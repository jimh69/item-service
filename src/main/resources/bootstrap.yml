spring:
  application:
    name: item-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888/config
      profile: dev
      label: main
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 3
  main:
    allow-bean-definition-overriding: true

# Logging for bootstrap configuration
logging:
  level:
    org.springframework.cloud: INFO
    org.springframework.boot.context.config: INFO
