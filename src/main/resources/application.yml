spring:
  application:
    version: @project.version@
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888/config
      profile: dev
      label: main
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 3
      enabled: true
      import-check:
        enabled: false
      username: configuser
      password: configpass
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: UTC

server:
  port: 8080

logging:
  level:
    com.example.itemservice: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.cloud: INFO
    org.hibernate.validator: WARN
    com.example.itemservice.config.ConfigServerConnectionMonitor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    path: logs
  json-content:
    enabled: true
  http:
    enabled: true

config:
  polling:
    enabled: true
    interval: 30000

springdoc:
  swagger-ui:
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true

spring.web.resources.add-mappings: false