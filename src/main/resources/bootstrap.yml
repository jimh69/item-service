spring:
  application:
    name: item-service
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888/config}
      name: item-service
      profile: dev
      label: null
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    bootstrap:
      enabled: true

logging:
  level:
    org.springframework.cloud: WARN
    org.springframework.cloud.config: WARN
    org.springframework.core.env.PropertySourcesPropertyResolver: WARN
